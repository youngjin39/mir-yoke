name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate_candidate:
    runs-on: macos-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/native/handoff-packet/target
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # 3.11 is the mir-mcp compatibility floor the suite also runs; 3.12 stays the default.
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.11
            3.12
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - run: uv sync --extra dev --extra vector --frozen
      - run: echo "UV_CACHE_DIR=$(uv cache dir)" >> "$GITHUB_ENV"
      # Offline setup tests resolve the tool independently of the project lock.
      - run: uv tool install --python .venv/bin/python --force --link-mode copy --constraints config/cli-runtime-constraints.txt .
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/mir-test-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/mir-test-bin
      - run: cargo build --locked
        working-directory: native/handoff-packet
      - run: cargo build --release --locked
        working-directory: native/handoff-packet
      - run: cargo build --release --locked
        working-directory: native/mir-mcp
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/native/mir-mcp/target
      - name: Validate repository release candidate
        run: uv run python scripts/verify_release_readiness.py --current-clean-tree
        env:
          MIR_MCP_NATIVE_BINARY: ${{ github.workspace }}/native/mir-mcp/target/release/mir-mcp
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release $GITHUB_REF_NAME already exists; leaving it unchanged."
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi
