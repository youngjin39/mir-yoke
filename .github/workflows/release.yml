name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate_candidate:
    name: validate release candidate (macOS, blocking)
    runs-on: macos-latest
    continue-on-error: false
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/native/handoff-packet/target
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # 3.11 is the mir-mcp compatibility floor the suite also runs; 3.12 stays the default.
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.11
            3.12
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - name: Preflight uv lock with extension-capable Python
        run: |
          python="$(brew --prefix)/opt/python@3.12/bin/python3.12"
          if [[ ! -x "$python" ]]; then brew install python@3.12; fi
          uv sync --python "$python" --extra dev --extra vector --locked
      - name: Preflight checkout and Python
        run: uv run --no-sync python scripts/ci_preflight.py --sqlite-vector
      - name: Preflight handoff Cargo lock
        run: cargo fetch --locked
        working-directory: native/handoff-packet
      - name: Preflight mir-mcp Cargo lock
        run: cargo fetch --locked
        working-directory: native/mir-mcp
      - run: echo "UV_CACHE_DIR=$(uv cache dir)" >> "$GITHUB_ENV"
      # Offline setup tests resolve the tool independently of the project lock.
      - name: Preflight offline installer dependencies
        run: uv tool install --python .venv/bin/python --force --link-mode copy --constraints config/cli-runtime-constraints.txt .
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/mir-test-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/mir-test-bin
      - run: cargo build --locked
        working-directory: native/handoff-packet
      - run: cargo build --release --locked
        working-directory: native/handoff-packet
      - run: cargo build --release --locked
        working-directory: native/mir-mcp
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/native/mir-mcp/target
      - name: Validate tagged repository
        run: uv run python scripts/verify_release_readiness.py --current-clean-tree --repository-only
        env:
          MIR_MCP_NATIVE_BINARY: ${{ github.workspace }}/native/mir-mcp/target/release/mir-mcp
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release $GITHUB_REF_NAME already exists; leaving it unchanged."
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi

  validate_advisory:
    name: release checks (${{ matrix.cohort }}, ${{ matrix.lane }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.lane == 'advisory' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, cohort: Linux, lane: advisory}
          - {os: windows-latest, cohort: Windows, lane: advisory}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Preflight checkout and record Git pins
        run: python scripts/ci_preflight.py --checkout-only 2>&1 | tee "$RUNNER_TEMP/yoke-ci-pins.txt"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - name: Preflight uv lock
        run: uv sync --extra dev --extra vector --locked
      - name: Preflight Python
        run: uv run --no-sync python scripts/ci_preflight.py --runtime-only --sqlite-vector
      - name: Preflight handoff Cargo lock
        run: cargo fetch --locked
        working-directory: native/handoff-packet
      - name: Preflight mir-mcp Cargo lock
        run: cargo fetch --locked
        working-directory: native/mir-mcp
      - run: cargo test --locked
        working-directory: native/handoff-packet
      - run: cargo test --locked
        working-directory: native/mir-mcp
      - name: Record advisory lane and pins
        if: ${{ !cancelled() }}
        env:
          COHORT: ${{ matrix.cohort }}
          STATUS: ${{ job.status }}
          CHECKOUT: ${{ steps.checkout.outcome }}
        run: |
          {
            printf '### %s advisory release checks\n\n' "$COHORT"
            printf -- '- Status: **%s**\n- Candidate: `%s` (`%s`)\n- Checkout: %s\n' \
              "$STATUS" "$GITHUB_SHA" "$GITHUB_REF" "$CHECKOUT"
            if [[ -f "$RUNNER_TEMP/yoke-ci-pins.txt" ]]; then
              printf '\n```text\n'
              cat "$RUNNER_TEMP/yoke-ci-pins.txt"
              printf '```\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
