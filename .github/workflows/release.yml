name: release-readiness
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  validate_candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - run: uv sync --extra dev --frozen
      - run: uv run python scripts/verify_release_readiness.py --current-clean-tree
      - name: Build deterministic distribution plane
        run: uv run yoke build --source-root . --output-dir dist --require-clean --json
      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: 'dist/*'
      - name: Upload release candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mir-yoke-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
