name: validate
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  supported_contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - run: uv sync --extra dev --frozen
      - run: >-
          uv run pytest -q
          tests/test_project_agent_kit.py
          tests/test_minimal_starter.py
          tests/test_public_template_identity.py
          tests/test_decision_authority.py
          tests/test_template_asset_classification.py
          tests/test_plugin_skill_packages.py
          tests/test_common_skill_contracts.py
      - run: uv run python scripts/verify_codex_sync.py
      - run: uv run ruff check

  public_cli:
    name: public Mir CLI regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - run: uv sync --extra dev --frozen
      - run: >-
          uv run pytest -q
          tests/test_installed_cli.py
          tests/test_bootstrap_cli.py
          tests/test_bootstrap_adoption_cli.py
          tests/test_existing_repository_adoption.py
          tests/test_greenfield_slim_integration.py
          tests/test_setup_wrappers.py
          tests/test_adr53_phase1_schema.py
          tests/test_adr53_phase2_population.py
          tests/test_adr53_phase3a_search.py
          tests/test_adr53_phase3b_context_cli.py
          tests/test_memory_doctor.py
          tests/test_migrations.py
          tests/test_loop_cli.py
          tests/test_loop_driver.py
          tests/test_capability_cli.py
          tests/test_capability_security.py
          tests/test_run_python_cli.py
          tests/test_runtime_manifest.py
          tools/mir_executor/tests

  portable_plugins:
    name: portable plugins (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - run: uv sync --extra dev --frozen
      - run: >-
          npm install --global
          @anthropic-ai/claude-code@2.1.223
          @openai/codex@0.146.1
      - run: >-
          uv run pytest -q
          tests/test_plugin_skill_packages.py
          tests/test_common_skill_contracts.py
      - run: uv run python scripts/verify_plugin_cli_activation.py

  static_public_checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install jsonschema pytest
      - run: python tests/test_schema_validity.py
      - run: python tests/test_link_integrity.py
      - run: python tests/test_hook_executability.py
      - run: python tests/test_no_korean_in_user_facing.py
      - run: python tests/test_phase_doc_completeness.py
