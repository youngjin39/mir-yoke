name: validate
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  native_handoff:
    name: native handoff byte parity (${{ matrix.cohort }}, ${{ matrix.lane }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.lane == 'advisory' }}
    strategy:
      fail-fast: false
      matrix:
        # Windows runs the same steps at the end of windows_native, the only Windows lane.
        os: [macos-latest, ubuntu-latest]
        include:
          - {os: macos-latest, cohort: macOS, lane: blocking}
          - {os: ubuntu-latest, cohort: Linux, lane: advisory}
    env:
      PYTHONUTF8: '1'
      CARGO_TARGET_DIR: ${{ github.workspace }}/native/handoff-packet/target
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        # 3.11 is the mir-mcp compatibility floor the MCP oracles also run.
        with:
          python-version: |
            3.11
            3.12
            3.14
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - name: Preflight uv lock (Python 3.14)
        run: |
          python=3.14
          if [[ "$RUNNER_OS" == macOS ]]; then
            # The E18 Python oracle loads sqlite-vec. The hosted Python lacks loadable extensions.
            python="$(brew --prefix)/opt/python@3.14/bin/python3.14"
            if [[ ! -x "$python" ]]; then brew install python@3.14; fi
          fi
          uv sync --python "$python" --extra dev --extra vector --locked
      - name: Preflight checkout and Python 3.14
        run: uv run --no-sync --python 3.14 python scripts/ci_preflight.py --sqlite-vector
      - name: Preflight uv lock and Python 3.12
        env:
          UV_PROJECT_ENVIRONMENT: .venv-312
        run: |
          uv sync --python 3.12 --extra dev --extra vector --locked
          uv run --no-sync python scripts/ci_preflight.py --runtime-only
      - name: Preflight handoff Cargo lock
        run: cargo fetch --locked
        working-directory: native/handoff-packet
      - name: Preflight mir-mcp Cargo lock
        run: cargo fetch --locked
        working-directory: native/mir-mcp
      # Runner rustup honors the crate's pinned toolchain and components.
      # cargo fmt has no --locked option: it only checks source formatting.
      - run: cargo fmt --check
        working-directory: native/handoff-packet
      # From here each step reports its own result: a failed lint must not hide the tests.
      - if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: native/handoff-packet
      - if: ${{ !cancelled() }}
        run: cargo test --locked --no-fail-fast
        working-directory: native/handoff-packet
      - if: ${{ !cancelled() }}
        run: cargo build --release --locked
        working-directory: native/handoff-packet
      - if: ${{ !cancelled() }}
        run: >-
          uv run --no-sync --python 3.14 pytest -q -p no:cacheprovider
          tests/test_delegation_gate_native_parity.py tests/test_policy_resolve_native_parity.py tests/test_handoff_packet_native_parity.py tests/test_executor_target_policy_native_parity.py tests/test_executor_verifier_policy_native_parity.py tests/test_executor_agent_route_policy_native_parity.py tests/test_executor_hooks_config_native_parity.py tests/test_executor_hooks_native_parity.py
          tests/test_lifecycle_native_commands.py tests/test_windows_parity_adapters.py
          tests/test_line_endings.py
      # These oracles use Python 3.12 argparse, Unicode and pathlib behavior.
      - if: ${{ !cancelled() }}
        run: >-
          uv run --no-sync pytest -q -p no:cacheprovider
          tests/test_executor_query_native_parity.py tests/test_runtime_verify_native_parity.py
        env:
          UV_PROJECT_ENVIRONMENT: .venv-312
      - if: ${{ !cancelled() }}
        run: uv run --no-sync --python 3.14 pytest -q -p no:cacheprovider tests/test_executor_execute_native_parity.py -k uses_caller_venv

      - if: ${{ !cancelled() }}
        run: cargo fmt --check
        working-directory: native/mir-mcp
      - if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: native/mir-mcp
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/native/mir-mcp/target
      - if: ${{ !cancelled() }}
        run: cargo test --locked --no-fail-fast
        working-directory: native/mir-mcp
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/native/mir-mcp/target
      - if: ${{ !cancelled() }}
        run: cargo build --release --locked
        working-directory: native/mir-mcp
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/native/mir-mcp/target
      - if: ${{ !cancelled() }}
        run: >-
          uv run --no-sync --python 3.14 pytest -q -p no:cacheprovider
          tests/test_mir_mcp_native_core.py tests/test_mir_mcp_native_io.py
          tests/test_mir_mcp_native_ontology.py tests/test_mir_mcp_native_relations.py
          tests/test_mir_mcp_native_dispatch.py
          tests/test_mir_mcp_launcher.py
        env:
          MIR_MCP_NATIVE_BINARY: ${{ github.workspace }}/native/mir-mcp/target/release/mir-mcp

  supported_contracts:
    name: supported contracts (Linux, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/native/handoff-packet/target
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - name: Preflight uv lock
        run: uv sync --extra dev --extra vector --locked
      - name: Preflight checkout and Python
        run: uv run --no-sync python scripts/ci_preflight.py
      - name: Preflight Cargo lock
        run: cargo fetch --locked
        working-directory: native/handoff-packet
      - run: cargo build --release --locked --bin project-hooks
        working-directory: native/handoff-packet
      - run: >-
          uv run pytest -q
          tests/test_project_agent_kit.py
          tests/test_minimal_starter.py
          tests/test_public_template_identity.py
          tests/test_decision_authority.py
          tests/test_template_asset_classification.py
          tests/test_native_release.py
          tests/test_plugin_skill_packages.py
          tests/test_common_skill_contracts.py
        env:
          MIR_PROJECT_HOOKS_BINARY: ${{ github.workspace }}/native/handoff-packet/target/release/project-hooks
      - run: uv run python scripts/verify_codex_sync.py
      - run: uv run ruff check

  public_cli:
    name: public Mir CLI regression (${{ matrix.cohort }}, ${{ matrix.lane }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.lane == 'advisory' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - {os: macos-latest, cohort: macOS, lane: blocking}
          - {os: ubuntu-latest, cohort: Linux, lane: advisory}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/native/handoff-packet/target
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - name: Preflight uv lock
        run: |
          python=3.12
          if [[ "$RUNNER_OS" == macOS ]]; then
            python="$(brew --prefix)/opt/python@3.12/bin/python3.12"
            if [[ ! -x "$python" ]]; then brew install python@3.12; fi
          fi
          uv sync --python "$python" --extra dev --extra vector --locked
      - name: Preflight checkout and Python
        run: uv run --no-sync python scripts/ci_preflight.py --sqlite-vector
      - run: echo "UV_CACHE_DIR=$(uv cache dir)" >> "$GITHUB_ENV"
      # Offline setup tests resolve the tool independently of the project lock.
      - name: Preflight offline installer dependencies
        if: runner.os == 'macOS'
        run: uv tool install --python .venv/bin/python --force --link-mode copy --constraints config/cli-runtime-constraints.txt .
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/mir-test-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/mir-test-bin
      - name: Preflight Cargo lock
        run: cargo fetch --locked
        working-directory: native/handoff-packet
      - run: >-
          uv run pytest -q
          tests/test_installed_cli.py
          tests/test_bootstrap_cli.py
          tests/test_bootstrap_adoption_cli.py
          tests/test_existing_repository_adoption.py
          tests/test_greenfield_slim_integration.py
          tests/test_setup_wrappers.py
          tests/test_adr53_phase1_schema.py
          tests/test_adr53_phase2_population.py
          tests/test_adr53_phase3a_search.py
          tests/test_adr53_phase3b_context_cli.py
          tests/test_memory_doctor.py
          tests/test_migrations.py
          tests/test_loop_cli.py
          tests/test_loop_driver.py
          tests/test_capability_cli.py
          tests/test_capability_native_artifacts.py
          tests/test_capability_mcp.py
          tests/test_capability_security.py
          tests/test_run_python_cli.py
          tests/test_runtime_manifest.py
          tests/test_executor_native_caller.py
          tests/test_executor_sync.py
          tools/mir_executor/tests

  portable_plugins:
    name: portable plugins (${{ matrix.cohort }}, ${{ matrix.lane }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.lane == 'advisory' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - {os: macos-latest, cohort: macOS, lane: blocking}
          - {os: ubuntu-latest, cohort: Linux, lane: advisory}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - name: Preflight uv lock
        run: uv sync --extra dev --extra vector --locked
      - name: Preflight checkout and Python
        run: uv run --no-sync python scripts/ci_preflight.py
      - run: >-
          npm install --global
          @anthropic-ai/claude-code@2.1.223
          @openai/codex@0.146.1
      - run: >-
          uv run pytest -q
          tests/test_plugin_skill_packages.py
          tests/test_common_skill_contracts.py
      - run: uv run python scripts/verify_plugin_cli_activation.py

  static_public_checks:
    name: static public checks (Linux, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Preflight checkout
        run: python scripts/ci_preflight.py --checkout-only
      - run: pip install jsonschema pytest
      - run: python tests/test_schema_validity.py
      - run: python tests/test_link_integrity.py
      - run: python tests/test_hook_executability.py
      - run: python tests/test_no_korean_in_user_facing.py
      - run: python tests/test_phase_doc_completeness.py

  windows_native:
    name: native manager, hooks and mir-mcp (Windows, advisory)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - name: Preflight uv lock (Python 3.12)
        run: uv sync --python 3.12 --extra dev --extra vector --locked
        env:
          UV_PROJECT_ENVIRONMENT: .venv-312
      - name: Preflight checkout and Python 3.12
        run: uv run --no-sync python scripts/ci_preflight.py
        env:
          UV_PROJECT_ENVIRONMENT: .venv-312
      - name: Preflight handoff Cargo lock
        run: cargo fetch --locked
        working-directory: native/handoff-packet
      - name: Preflight mir-mcp Cargo lock
        run: cargo fetch --locked
        working-directory: native/mir-mcp
      - name: Windows smoke (Python 3.12)
        env:
          UV_PROJECT_ENVIRONMENT: .venv-312
        run: >-
          uv run --no-sync pytest -q
          tests/test_line_endings.py
          tests/test_private_file.py
          tests/test_capability_materialized_acl.py
          tests/test_capability_windows_paths.py
          tests/test_codex_derivation_script.py
          tests/test_capability_cli.py
          tests/test_capability_security.py
          tests/test_capability_mcp.py
          tests/test_capability_native_artifacts.py
          tests/test_capability_legacy_080.py
          tests/test_mechanical_handoff.py
          tests/test_compact_lifecycle_hooks.py
          tests/test_lifecycle_windows_launcher.py
          tests/test_hook_executability.py
          tests/test_ontology_runner.py
          tests/test_ontology_skill.py
          tests/test_capability_gaploop.py
          tests/test_deny_list.py
          tests/test_minimal_starter.py
          tests/test_mir_mcp_windows_guard.py
          tests/test_mir_mcp_security.py
          tests/test_mir_mcp_indirect_guards.py
          tests/test_mir_mcp_protocol.py
          tests/test_mir_mcp_git.py
          tests/test_mir_mcp_limits.py
          tests/test_mir_mcp_package.py
          tests/test_mir_mcp_checker.py
          tests/test_mir_mcp_relations.py
      - name: PowerShell launcher (Python 3.12)
        env:
          UV_PROJECT_ENVIRONMENT: .venv-312
        run: uv run --no-sync pytest -q tests/test_setup_wrappers.py -k powershell_launcher
      # Native handoff byte parity on Windows (same steps as native_handoff).
      - name: Preflight uv lock (Python 3.14)
        run: uv sync --python 3.14 --extra dev --extra vector --locked
      - name: Preflight Python 3.14
        run: uv run --no-sync --python 3.14 python scripts/ci_preflight.py --runtime-only --sqlite-vector
      - run: cargo fmt --check
        working-directory: native/handoff-packet
      # From here each step reports its own result: a failed lint must not hide the tests.
      - if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: native/handoff-packet
      - if: ${{ !cancelled() }}
        run: cargo test --locked --no-fail-fast
        working-directory: native/handoff-packet
      - if: ${{ !cancelled() }}
        run: cargo build --release --locked
        working-directory: native/handoff-packet
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/native/handoff-packet/target
      - name: Native parity (Python 3.14)
        if: ${{ !cancelled() }}
        run: uv run --no-sync --python 3.14 pytest -q -p no:cacheprovider tests/test_delegation_gate_native_parity.py tests/test_policy_resolve_native_parity.py tests/test_handoff_packet_native_parity.py tests/test_executor_target_policy_native_parity.py tests/test_executor_verifier_policy_native_parity.py tests/test_executor_agent_route_policy_native_parity.py tests/test_executor_hooks_config_native_parity.py tests/test_executor_hooks_native_parity.py tests/test_lifecycle_native_commands.py tests/test_windows_parity_adapters.py
        env:
          PYTHONUTF8: '1'
          CARGO_TARGET_DIR: ${{ github.workspace }}/native/handoff-packet/target
      - name: Native oracle parity (Python 3.12)
        if: ${{ !cancelled() }}
        run: uv run --no-sync pytest -q -p no:cacheprovider tests/test_executor_query_native_parity.py tests/test_runtime_verify_native_parity.py
        env:
          UV_PROJECT_ENVIRONMENT: .venv-312
          PYTHONUTF8: '1'
          CARGO_TARGET_DIR: ${{ github.workspace }}/native/handoff-packet/target
      - name: Caller environment parity (Python 3.14)
        if: ${{ !cancelled() }}
        run: uv run --no-sync --python 3.14 pytest -q -p no:cacheprovider tests/test_executor_execute_native_parity.py -k uses_caller_venv
        env:
          PYTHONUTF8: '1'
          CARGO_TARGET_DIR: ${{ github.workspace }}/native/handoff-packet/target

      - if: ${{ !cancelled() }}
        run: cargo fmt --check
        working-directory: native/mir-mcp
      - if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: native/mir-mcp
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/native/mir-mcp/target
      - if: ${{ !cancelled() }}
        run: cargo test --locked --no-fail-fast
        working-directory: native/mir-mcp
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/native/mir-mcp/target
      - if: ${{ !cancelled() }}
        run: cargo build --release --locked
        working-directory: native/mir-mcp
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/native/mir-mcp/target
      - name: MCP parity (Python 3.14)
        if: ${{ !cancelled() }}
        run: >-
          uv run --no-sync --python 3.14 pytest -q -p no:cacheprovider
          tests/test_mir_mcp_native_core.py tests/test_mir_mcp_native_io.py
          tests/test_mir_mcp_native_ontology.py tests/test_mir_mcp_native_relations.py
          tests/test_mir_mcp_native_dispatch.py
          tests/test_mir_mcp_launcher.py
        env:
          PYTHONUTF8: 1
          MIR_MCP_NATIVE_BINARY: ${{ github.workspace }}/native/mir-mcp/target/release/mir-mcp.exe
