name: native-artifacts
# Proof of concept for per-target native binaries: build, smoke-run on the
# target where the runner can execute it, and record SHA-256 digests.
# Manual only; uploads artifacts by default. Publication requires explicit opt-in.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish or update the source-pinned native prerelease
        type: boolean
        default: false
      mac_only:
        description: Publish only the two Darwin targets
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-artifacts-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.target }} (${{ matrix.cohort }}, ${{ matrix.lane }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.lane == 'advisory' }}
    strategy:
      fail-fast: false
      matrix:
        # Keep a single build gate. A Mac publication schedules only its two Darwin jobs.
        include: >-
          ${{ fromJSON(format('[{0}{1}]',
            '{"os":"macos-latest","target":"aarch64-apple-darwin","exe":"","cohort":"macOS","lane":"blocking"},
             {"os":"macos-15-intel","target":"x86_64-apple-darwin","exe":"","cohort":"macOS","lane":"blocking"}',
            (!inputs.publish || !inputs.mac_only) &&
            ',{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu","exe":"","cohort":"Linux","lane":"advisory"},
              {"os":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu","exe":"","cohort":"Linux","lane":"advisory"},
              {"os":"windows-latest","target":"x86_64-pc-windows-msvc","exe":".exe","cohort":"Windows","lane":"advisory"}' || ''
          )) }}
    defaults:
      run:
        shell: bash
        working-directory: native/handoff-packet
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.14'}
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
        working-directory: native/mir-mcp
      - name: smoke run
        # An ordinary tool call must print nothing and exit 0; a handoff turn
        # that forbids commands must deny with exit 2.
        run: |
          bin="target/${{ matrix.target }}/release/handoff-packet${{ matrix.exe }}"
          out=$(printf '%s' '{"hook_event_name":"PreToolUse","tool_name":"Read","prompt":"Inspect.","tool_input":{}}' | "$bin")
          test -z "$out"
          continuity="target/${{ matrix.target }}/release/runtime-continuity${{ matrix.exe }}"
          "$continuity" > session.out
          grep -q 'Mir lifecycle continuity' session.out
          gate="target/${{ matrix.target }}/release/bootstrap-gate${{ matrix.exe }}"
          test "$("$gate" --version)" = "bootstrap-gate 0.1.0"
          verifier="target/${{ matrix.target }}/release/runtime-verify${{ matrix.exe }}"
          test "$("$verifier" --version)" = "runtime-verify 0.1.0"
          set +e
          printf '%s' '{"hook_event_name":"PreToolUse","tool_name":"Bash","prompt":"Write a handoff for Codex.\nNo commands.","tool_input":{"command":"pwd"}}' | "$bin" > deny.out
          code=$?
          set -e
          test "$code" = 2
          grep -q '"permissionDecision": "deny"' deny.out
          delegation="target/${{ matrix.target }}/release/delegation-gate${{ matrix.exe }}"
          test "$("$delegation" --version)" = "delegation-gate 0.1.0"
          hooks="target/${{ matrix.target }}/release/project-hooks${{ matrix.exe }}"
          "$hooks" --mir-warmup
          hooks_capabilities=$(sed -n 's/^const CAPABILITIES: &str = "\(.*\)";$/\1/p' src/project_hooks.rs)
          test -n "$hooks_capabilities"
          "$hooks" capabilities | cmp - <(printf '%b' "$hooks_capabilities")
          query="target/${{ matrix.target }}/release/executor-query${{ matrix.exe }}"
          set +e
          "$query" --help > query.out 2> query.err
          code=$?
          set -e
          test "$code" = 64
          test ! -s query.out
          test ! -s query.err
          mcp="../mir-mcp/target/${{ matrix.target }}/release/mir-mcp${{ matrix.exe }}"
          python="$(python -c 'import sys; print(sys.executable)')"
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}' | "$mcp" --reference-python "$python" --reference-script ../../plugins/mir-mcp/mir_mcp.py > mcp.out
          grep -q '"tools"' mcp.out
          grep -q '"jsonrpc":"2.0"' mcp.out
          if [[ '${{ matrix.target }}' == *-apple-darwin ]]; then
            mir="target/${{ matrix.target }}/release/mir"
            "$mir" --help
            runtime="$(mktemp -d)"
            trap 'rm -rf "$runtime"' EXIT
            PATH= "$mir" runtime-manifest create --runtime-root "$runtime" \
              --manifest "$runtime/manifest.json" --source-url https://github.com/${{ github.repository }} \
              --source-commit "${{ github.sha }}" --constraints-sha256 smoke
            test -s "$runtime/manifest.json"
          fi
      - name: digest
        run: |
          mkdir -p ../../dist-native
          cd ../../dist-native
          console=""
          if [[ '${{ matrix.target }}' == *-apple-darwin ]]; then console=mir; fi
          for name in handoff-packet runtime-continuity bootstrap-gate runtime-verify executor-query delegation-gate project-hooks mir-mcp $console; do
            f="$name-${{ matrix.target }}${{ matrix.exe }}"
            crate=handoff-packet
            if test "$name" = mir-mcp; then crate=mir-mcp; fi
            cp "../native/$crate/target/${{ matrix.target }}/release/$name${{ matrix.exe }}" "$f"
            if command -v sha256sum >/dev/null; then sha256sum "$f"; else shasum -a 256 "$f"; fi
          done > "SHA256-${{ matrix.target }}.txt"
          cat "SHA256-${{ matrix.target }}.txt"
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: handoff-packet-${{ matrix.target }}
          path: dist-native/
          if-no-files-found: error

  publish:
    name: publish native artifacts (macOS, blocking)
    if: ${{ inputs.publish }}
    needs: build
    runs-on: macos-latest
    continue-on-error: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: handoff-packet-${{ inputs.mac_only && '*-apple-darwin' || '*' }}
          merge-multiple: true
          path: dist-native
      - name: publish exact built bytes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          MAC_ONLY: ${{ inputs.mac_only }}
        shell: bash
        run: |
          set -euo pipefail
          tag="native-${SOURCE_SHA:0:12}"
          cd dist-native
          expected=47
          if [[ "$MAC_ONLY" == true ]]; then expected=20; fi
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq "$expected"
          for digest in SHA256-*.txt; do
            if command -v sha256sum >/dev/null; then
              sha256sum --check "$digest"
            else
              shasum -a 256 --check "$digest"
            fi
          done
          uploads=(./*)
          if gh release view "$tag" >/dev/null 2>&1; then
            existing=$(gh release view "$tag" --json assets --jq '.assets[].name')
            while IFS= read -r name; do
              [[ -n "$name" ]] || continue
              for asset in "${uploads[@]}"; do
                if [[ "$asset" == "./$name" ]]; then continue 2; fi
              done
              printf 'Existing asset is outside the publish list: %s\n' "$name" >&2
              exit 1
            done <<< "$existing"
            gh release edit "$tag" --prerelease --title "$tag"
          else
            gh release create "$tag" --target "$SOURCE_SHA" --prerelease --title "$tag" \
              --notes "Native lifecycle, MCP and macOS CLI binaries from source $SOURCE_SHA."
          fi
          gh release upload "$tag" "${uploads[@]}" --clobber
