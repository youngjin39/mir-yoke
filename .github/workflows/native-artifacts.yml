name: native-artifacts
# Proof of concept for per-target native binaries: build, smoke-run on the
# target where the runner can execute it, and record SHA-256 digests.
# Manual only; uploads artifacts by default. Publication requires explicit opt-in.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish or update the source-pinned native prerelease
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-artifacts-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-latest, target: aarch64-apple-darwin, exe: ''}
          - {os: macos-latest, target: x86_64-apple-darwin, exe: ''}
          - {os: ubuntu-latest, target: x86_64-unknown-linux-gnu, exe: ''}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, exe: ''}
          - {os: windows-latest, target: x86_64-pc-windows-msvc, exe: '.exe'}
    defaults:
      run:
        shell: bash
        working-directory: native/handoff-packet
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: smoke run
        # An ordinary tool call must print nothing and exit 0; a handoff turn
        # that forbids commands must deny with exit 2.
        run: |
          bin="target/${{ matrix.target }}/release/handoff-packet${{ matrix.exe }}"
          out=$(printf '%s' '{"hook_event_name":"PreToolUse","tool_name":"Read","prompt":"Inspect.","tool_input":{}}' | "$bin")
          test -z "$out"
          continuity="target/${{ matrix.target }}/release/runtime-continuity${{ matrix.exe }}"
          "$continuity" > session.out
          grep -q 'Mir lifecycle continuity' session.out
          gate="target/${{ matrix.target }}/release/bootstrap-gate${{ matrix.exe }}"
          test "$("$gate" --version)" = "bootstrap-gate 0.1.0"
          set +e
          printf '%s' '{"hook_event_name":"PreToolUse","tool_name":"Bash","prompt":"Write a handoff for Codex.\nNo commands.","tool_input":{"command":"pwd"}}' | "$bin" > deny.out
          code=$?
          set -e
          test "$code" = 2
          grep -q '"permissionDecision": "deny"' deny.out
      - name: digest
        run: |
          mkdir -p ../../dist-native
          cd ../../dist-native
          for name in handoff-packet runtime-continuity bootstrap-gate; do
            f="$name-${{ matrix.target }}${{ matrix.exe }}"
            cp "../native/handoff-packet/target/${{ matrix.target }}/release/$name${{ matrix.exe }}" "$f"
            if command -v sha256sum >/dev/null; then sha256sum "$f"; else shasum -a 256 "$f"; fi
          done > "SHA256-${{ matrix.target }}.txt"
          cat "SHA256-${{ matrix.target }}.txt"
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: handoff-packet-${{ matrix.target }}
          path: dist-native/
          if-no-files-found: error

  publish:
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: handoff-packet-*
          merge-multiple: true
          path: dist-native
      - name: publish exact built bytes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="native-${SOURCE_SHA:0:12}"
          cd dist-native
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 20
          for digest in SHA256-*.txt; do sha256sum --check "$digest"; done
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --prerelease --title "$tag"
          else
            gh release create "$tag" --target "$SOURCE_SHA" --prerelease --title "$tag" \
              --notes "Optional lifecycle binaries from source $SOURCE_SHA."
          fi
          gh release upload "$tag" ./* --clobber
