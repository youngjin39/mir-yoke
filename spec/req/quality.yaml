requirements:
  - id: QR-001
    type: quality
    statement: "A clean supported bootstrap path shall complete on macOS, native Windows PowerShell, and Linux using the same coordinator contract."
    origin: "Mir Yoke ADR-74 acceptance criterion 1; owner public reuse goal."
    actor: greenfield_owner
    trigger: "A clean-platform bootstrap verification starts."
    preconditions: ["Documented platform prerequisites are installed."]
    postconditions: ["All three platform lanes produce equivalent contract fields."]
    acceptance:
      - {given: "clean supported macOS, Windows, and Linux environments", when: "the platform bootstrap matrix runs", then: "three lanes pass and emit the same required result keys"}
      - {given: "a platform-specific wrapper bypassing the common coordinator", when: "wrapper parity validation runs", then: "validation fails"}
    data_contract:
      - {name: "PlatformResult", direction: O, type: "object", format: "JSON", unit: "platform lane", range: "three supported lanes", nullable: false, default: "none", precision: "identical required keys", tolerance: "zero missing lanes"}
    errors: [{condition: "a prerequisite or common coordinator is unavailable", behavior: "report the unsupported prerequisite and do not claim platform readiness"}]
    verification: e2e
    authority: platform
    status: ready
    confidence: high
    evidence: ["setup.sh:1", "setup.ps1:1", "docs/decisions/adr-74-portable-bootstrap-capability-sources-and-memory.md:158"]

  - id: QR-002
    type: quality
    statement: "A failed existing-repository operation shall leave all authored files and any prior receipt byte-identical."
    origin: "Mir Yoke ADR-77 acceptance criteria 1-4."
    actor: existing_repository_owner
    trigger: "An adoption or update operation fails."
    preconditions: ["Pre-operation digests are recorded for authored files and the prior receipt."]
    postconditions: ["Post-failure digests equal the pre-operation digests."]
    acceptance:
      - {given: "a valid existing repository and passing checks", when: "dry-run completes", then: "authored-file and receipt digests remain unchanged"}
      - {given: "a failure after preflight", when: "the operation exits", then: "all authored-file and prior-receipt digests match their pre-operation values"}
    data_contract:
      - {name: "PreservationDigestSet", direction: O, type: "map", format: "relative path to SHA-256", unit: "digest", range: "every protected authored path and prior receipt", nullable: false, default: "empty map", precision: "256 bits", tolerance: "zero changed digests on failure"}
    errors: [{condition: "a post-failure digest differs", behavior: "report preservation failure and block completion"}]
    verification: e2e
    authority: system
    status: ready
    confidence: high
    evidence: ["docs/decisions/adr-77-existing-repository-bootstrap-adoption.md:70"]

  - id: QR-003
    type: quality
    statement: "A locked capability synchronization shall reproduce the selected plugin tree hashes for one exact source commit."
    origin: "Mir Yoke ADR-74 acceptance criteria 2 and 5; ADR-84 hash boundary."
    actor: greenfield_owner
    trigger: "A locked capability is synchronized on another supported machine."
    preconditions: ["The source commit and selected tree hashes are present in the lock."]
    postconditions: ["Materialized selected trees match every locked hash."]
    acceptance:
      - {given: "a valid lock and reachable exact commit", when: "locked synchronization runs", then: "every selected plugin tree digest equals its lock value"}
      - {given: "one mismatched tree, moving ref, or untrusted path", when: "synchronization runs", then: "activation is refused and the prior provider remains active"}
    data_contract:
      - {name: "CapabilityLock", direction: I, type: "object", format: "source URL, exact commit, selected tree hashes", unit: "lock", range: "one commit and one digest per selected tree", nullable: false, default: "none", precision: "40-hex commit and SHA-256 tree digests", tolerance: "zero mismatches"}
    errors: [{condition: "commit, tree, path, or trust validation fails", behavior: "preserve the prior provider and return a failed result"}]
    verification: integration
    authority: platform
    status: ready
    confidence: high
    evidence: ["config/capability-sources.json:1", "src/mir/core/capabilities/manager.py:1"]

  - id: QR-004
    type: quality
    statement: "The first product section of every root authority document shall state template identity and provider non-runtime authority without a central-fleet instruction."
    origin: "Owner clarity requirement 2026-08-08; recovered README, CLAUDE, ARCHITECTURE mismatch."
    actor: public_evaluator
    trigger: "A root authority document is opened or validated."
    preconditions: ["README, CLAUDE, ARCHITECTURE, and the public decision index exist."]
    postconditions: ["All four documents state one compatible product boundary."]
    acceptance:
      - {given: "the four root authority documents", when: "identity consistency validation runs", then: "all four identify a template, deny provider runtime, and deny central-fleet authority"}
      - {given: "one current root document that calls Mir Yoke a fleet manager, runtime, or direct-apply source", when: "identity consistency validation runs", then: "validation fails and reports the document"}
    data_contract:
      - {name: "IdentityConsistencyReport", direction: O, type: "object", format: "document, required claims, forbidden claims", unit: "document result", range: "four document results", nullable: false, default: "none", precision: "one result per authority document", tolerance: "zero conflicting documents"}
    errors: [{condition: "a root authority document is missing or unreadable", behavior: "fail identity consistency validation"}]
    verification: integration
    authority: system
    status: ready
    confidence: high
    evidence: ["README.md:14", "CLAUDE.md:1", "ARCHITECTURE.md:1", "docs/decisions/INDEX.md:1"]
