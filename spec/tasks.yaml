tasks:
  - id: TASK-001
    goal: "Add the Mir Yoke-local public-template identity ADR and make it the highest current product decision."
    touches: ["docs/decisions/adr-78-public-template-identity-and-non-authority.md", "docs/decisions/INDEX.md"]
    done_when: {command: "uv run pytest tests/test_decision_authority.py -q"}
    status: done
  - id: TASK-002
    goal: "Make every root authority surface state one template-only, provider-non-runtime boundary."
    touches: ["README.md", "CLAUDE.md", "ARCHITECTURE.md", "config/repos/mir-yoke.json", "config/harness-consistency.json"]
    done_when: {command: "uv run pytest tests/test_public_template_identity.py -q"}
    status: done
  - id: TASK-003
    goal: "Classify every active product surface and fail release validation on missing or duplicate classifications."
    touches: ["config/template-assets.json", "config/template-assets.schema.json", "tools/harness_consistency/", "tests/test_template_asset_classification.py"]
    done_when: {command: "uv run pytest tests/test_template_asset_classification.py -q"}
    status: done
  - id: TASK-004
    goal: "Separate transactional slim greenfield creation from preservation-first existing-repository reference and receipt flows."
    touches: ["README.md", "BOOTSTRAP.md", "setup.sh", "setup.ps1", "src/mir/cli/bootstrap.py", "src/mir/core/adoption/", "src/mir/cli/bootstrap_adoption.py", "tests/test_bootstrap_cli.py", "tests/test_adopter_slim.py", "tests/test_installed_cli.py", "tests/test_existing_repository_adoption.py"]
    done_when: {command: "uv run pytest tests/test_bootstrap_cli.py tests/test_adopter_slim.py tests/test_installed_cli.py tests/test_existing_repository_adoption.py -q"}
    status: done
  - id: TASK-005
    goal: "Constrain capability and hash operations to explicit local provenance and integrity behavior."
    touches: ["config/capability-sources.json", "src/mir/cli/capability.py", "src/mir/core/capabilities/", "tests/test_capability_cli.py", "tests/test_capability_security.py"]
    done_when: {command: "uv run pytest tests/test_capability_cli.py tests/test_capability_security.py -q"}
    status: done
  - id: TASK-006
    goal: "Move centralization-era prose behind historical authority and remove unclassified central-fleet executables from the active payload."
    touches: ["docs/decisions/", "docs/harness-engineering/", "docs/history/centralization/", "tests/test_decision_authority.py"]
    done_when: {command: "uv run pytest tests/test_decision_authority.py -q"}
    status: done
  - id: TASK-007
    goal: "Make validation and release workflows public-template-local and remove fleet notification or target mutation effects."
    touches: [".github/workflows/", "scripts/", "tests/test_public_template_surface.py", "tests/test_release_readiness.py"]
    done_when: {command: "uv run pytest tests/test_public_template_surface.py tests/test_release_readiness.py -q"}
    status: done
  - id: TASK-009
    goal: "Narrow automated greenfield bootstrap to macOS, Linux, and WSL, and make native Windows an agent-guided zero-mutation path."
    touches: ["README.md", "CLAUDE.md", "BOOTSTRAP.md", "ARCHITECTURE.md", "setup.sh", "setup.ps1", "src/mir/cli/bootstrap.py", ".github/workflows/validate.yml", "spec/", "tests/test_bootstrap_cli.py", "tests/test_setup_wrappers.py"]
    done_when: {command: "uv run pytest tests/test_decision_authority.py tests/test_public_template_identity.py tests/test_bootstrap_cli.py tests/test_setup_wrappers.py tests/test_spec_integrity.py -q"}
    status: done
  - id: TASK-010
    goal: "Close release runtime isolation, exact-source installation, Git push ownership, provider-only asset exclusion, and portable starter locking."
    touches: ["docs/decisions/adr-80-release-runtime-isolation-and-adopter-ownership.md", "setup.sh", "config/cli-runtime-constraints.txt", "src/mir/cli/bootstrap.py", "scripts/loop_driver.sh", "config/template-assets.json", "config/adopter-boundary.json", "config/capability-sources.json", "tests/test_setup_wrappers.py", "tests/test_bootstrap_cli.py", "tests/test_greenfield_slim_integration.py", "tests/test_loop_driver.py"]
    done_when: {command: "uv run pytest tests/test_setup_wrappers.py tests/test_bootstrap_cli.py tests/test_greenfield_slim_integration.py tests/test_template_asset_classification.py tests/test_loop_driver.py -q"}
    status: done
  - id: TASK-008
    goal: "Prove the completed template boundary from a clean clone with the focused contracts, full suite, lint, derivative, and sanitize checks."
    touches: ["tests/", "tools/harness_consistency/", ".github/workflows/validate.yml"]
    done_when: {command: "uv run python scripts/verify_release_readiness.py"}
    status: done
