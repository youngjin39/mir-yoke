[project]
name = "mir-harness"
version = "0.9.0"
description = "Mir Yoke — local project harness with a minimal core and optional capability packs"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
authors = [{name = "Harness Contributors"}]

# Runtime dependencies for the memory engine and externalized loop driver.
# pydantic and PyYAML are required by `mir loop`; private heavy deps stay out.
dependencies = [
    "httpx>=0.27,<1",
    "markdown-it-py>=3.0,<4",
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
    "jsonschema>=4,<5",
]

[project.optional-dependencies]
vector = ["sqlite-vec>=0.1.9,<0.2"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
mir = "mir.cli.__main__:main"
yoke = "mir.cli.yoke:main"

[project.entry-points."mir.embedding_backends"]
omlx_http = "mir.core.engine.memory.backends.omlx_http:OmlxHttpBackend"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mir"]

[tool.hatch.build.targets.wheel.force-include]
"tools/autonomous_loop" = "tools/autonomous_loop"
"tools/agent_loader" = "tools/agent_loader"
"tools/catalog_loader.py" = "tools/catalog_loader.py"
"tools/hooks" = "tools/hooks"
"tools/mir_executor" = "tools/mir_executor"
"tools/plan_archive" = "tools/plan_archive"
"tools/run_orchestrator" = "tools/run_orchestrator"
".claude/hooks/_lib/bootstrap-gate.sh" = "mir/resources/hooks/bootstrap-gate.sh"
".claude/hooks/_lib/run-python.sh" = "mir/resources/hooks/run-python.sh"

[tool.pytest.ini_options]
# Reclaim pytest scratch immediately. The default retention keeps three full runs,
# which filled the internal SSD to 100% in the Mir harness on 2026-07-28.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1

testpaths = ["tests", "tools"]
pythonpath = [".", "src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
