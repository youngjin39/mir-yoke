[package]
name = "handoff-packet"
version = "0.1.0"
edition = "2024"
publish = false
description = "Native lifecycle handoff hook paths (proof of concept)."
license = "MIT"

[[bin]]
name = "handoff-packet"
path = "src/main.rs"

[[bin]]
name = "runtime-continuity"
path = "src/runtime_continuity.rs"

[[bin]]
name = "bootstrap-gate"
path = "src/bootstrap_gate.rs"

[dependencies]
serde_json = { version = "1", features = ["unbounded_depth", "float_roundtrip"] }
regex = "1"
fancy-regex = "0.14"
toml = { version = "=0.8.2", default-features = false, features = ["parse"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[[bin]]
name = "runtime-verify"
path = "src/runtime_verify.rs"

[[bin]]
name = "executor-query"
path = "src/executor_query.rs"
